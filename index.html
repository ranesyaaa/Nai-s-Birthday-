<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Enai!</title>
    <style>
        :root {
            --paper-bg: #f8f1e0;
            --card-open-max-width: 850px;
            --card-margin-top: 3vh;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: #d1bc96;
            background-image: radial-gradient(#b8a27d 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        #main-stage {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            margin-top: var(--card-margin-top);
            padding: 10px;
        }

        .card-perspective-container {
            position: relative;
            perspective: 2000px;
            width: 100%;
            max-width: var(--card-open-max-width);
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        /* --- COVER CARD --- */
        .card-cover {
            display: block;
            margin: 0 auto;
            border: 8px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.4s;
            width: 320px;
            max-width: 85vw;
            background-color: var(--paper-bg);
            border-radius: 6px;
            text-align: center;
        }

        .card-cover:hover {
            transform: scale(1.02) rotate(-1deg);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .card-cover img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
        }

        .cover-hint {
            padding: 8px;
            font-size: 12px;
            color: #777;
            font-weight: bold;
        }

        /* --- OPEN CARD SPREAD --- */
        .card-spread {
            display: none;
            width: 100%;
            max-width: var(--card-open-max-width);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 8px solid white;
            background-color: var(--paper-bg);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .card-spread.is-open {
            display: flex;
            flex-direction: row;
            align-items: stretch;
        }

        @media (max-width: 680px) {
            .card-spread.is-open {
                flex-direction: column;
            }
            .left-page {
                border-right: none !important;
                border-bottom: 1px dashed #ccc;
            }
        }

        .card-page {
            flex: 1;
            position: relative;
            background-color: var(--paper-bg);
            padding: 20px;
            display: grid;
            grid-template-rows: 1fr auto;
            align-items: center;
            justify-items: center;
            gap: 15px;
            min-height: 480px;
        }

        .left-page {
            border-right: 1px dashed #ccc;
        }

        /* --- BUTTON TUTUP --- */
        #close-card-btn {
            margin-top: 20px;
            margin-bottom: 20px;
            padding: 10px 22px;
            font-size: 14px;
            font-family: inherit;
            font-weight: bold;
            background-color: #8c6d46;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: none;
            transition: background 0.2s;
        }

        #close-card-btn:hover {
            background-color: #705534;
        }

        .card-spread.is-open + #close-card-btn {
            display: block;
        }

        /* --- HALAMAN SURAT & AMPLOP --- */
        .envelope-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px;
            height: 100%;
            display: grid;
            grid-template-areas: "stack";
            align-items: center;
            justify-items: center;
        }

        .envelope-image, .letter-content {
            grid-area: stack;
            width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .envelope-image {
            z-index: 10;
        }

        .letter-content {
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            z-index: 5;
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        .letter-content.letter-open {
            transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 100;
            opacity: 1;
            pointer-events: auto;
        }

        .btn-letter-toggle {
            padding: 10px 22px;
            font-size: 13px;
